name: Build audio-enabled base image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [handler.py, Dockerfile, "src/**", ".github/workflows/build-audio.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: ghcr.io/shudesu/worker-comfyui-audio:base
          build-args: |
            COMFYUI_VERSION=0.32.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
